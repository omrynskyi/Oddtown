# SLIM and the AGNTCY Directory for local runs.
#   docker compose up -d --wait
# SLIM listens on localhost:46357 and the Directory API on localhost:8888.
# If 8888 is taken (Jupyter likes it), set DIRECTORY_PORT and DIRECTORY_ADDRESS in .env.

name: oddtown

services:
  slim:
    # The app-sdk pins slim-bindings 1.x, so the node stays on 1.x too.
    image: ghcr.io/agntcy/slim:1.4.0
    command: ["/slim", "--config", "/config/slim.yaml"]
    volumes:
      - ./config/slim.yaml:/config/slim.yaml:ro
    ports:
      - "46357:46357"
    restart: unless-stopped

  dir-apiserver:
    image: ghcr.io/agntcy/dir-apiserver:v1.5.0
    environment:
      DIRECTORY_SERVER_LISTEN_ADDRESS: 0.0.0.0:8888
      DIRECTORY_SERVER_OASF_API_VALIDATION_SCHEMA_URL: https://schema.oasf.outshift.com
      DIRECTORY_SERVER_AUTHN_ENABLED: "false"
      DIRECTORY_SERVER_AUTHZ_ENABLED: "false"
      DIRECTORY_SERVER_STORE_PROVIDER: oci
      DIRECTORY_SERVER_STORE_OCI_REGISTRY_ADDRESS: zot:5000
      DIRECTORY_SERVER_STORE_OCI_REPOSITORY_NAME: dir
      DIRECTORY_SERVER_STORE_OCI_AUTH_CONFIG_INSECURE: "true"
      DIRECTORY_SERVER_ROUTING_LISTEN_ADDRESS: /ip4/0.0.0.0/tcp/8999
      DIRECTORY_SERVER_ROUTING_GOSSIPSUB_ENABLED: "false"
      DIRECTORY_SERVER_DATABASE_TYPE: postgres
      DIRECTORY_SERVER_DATABASE_POSTGRES_HOST: postgres
      DIRECTORY_SERVER_DATABASE_POSTGRES_PORT: "5432"
      DIRECTORY_SERVER_DATABASE_POSTGRES_DATABASE: directory
      DIRECTORY_SERVER_DATABASE_POSTGRES_USERNAME: postgres
      DIRECTORY_SERVER_DATABASE_POSTGRES_PASSWORD: postgres
      DIRECTORY_SERVER_DATABASE_POSTGRES_SSL_MODE: disable
      DIRECTORY_SERVER_METRICS_ENABLED: "false"
      DIRECTORY_SERVER_RATELIMIT_ENABLED: "false"
      DIRECTORY_LOGGER_LOG_LEVEL: INFO
      DIRECTORY_LOGGER_LOG_FORMAT: text
    ports:
      - "${DIRECTORY_PORT:-8888}:8888"
    depends_on:
      zot:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=127.0.0.1:8888"]
      interval: 3s
      retries: 40
      start_period: 5s
    restart: unless-stopped

  zot:
    image: ghcr.io/project-zot/zot:v2.1.17
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: directory
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "directory"]
      interval: 2s
      retries: 30
    restart: unless-stopped
